name: UK & Channel Islands Ranked
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    # A branch, pull request or automated event must never publish live output.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: production-screener
      cancel-in-progress: false
      queue: max
    env:
      FMP_REQUESTS_PER_MINUTE: '1800'
      FMP_CONCURRENCY: '30'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install aiohttp gspread==6.0.1 openpyxl
      - run: python -m unittest discover -s tests -p 'test_uk_ci*.py' -v
      - name: Preserve shared FMP account handoff
        run: sleep 61
      - name: Rank UK and Channel Islands issuers
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          mkdir -p private_uk_ci
          python - <<'PY'
          import os
          from pathlib import Path
          credentials = os.environ.pop("SERVICE_ACCOUNT_JSON", "")
          if not credentials:
              raise SystemExit("Existing Google Sheets writer secret is not configured")
          Path("private_uk_ci/service_account.json").write_text(credentials)
          PY
          unset SERVICE_ACCOUNT_JSON
          python uk_ci_ranked.py
      - name: Remove temporary credentials
        if: always()
        run: rm -f private_uk_ci/service_account.json
