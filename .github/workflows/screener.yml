# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Cloud Screener

on:
  schedule:
    - cron: '0 3 * * 6'
      timezone: "Europe/London"
  issues:
      types:
        - opened
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p 'test_completion.py' -v
      - run: python -m unittest discover -s tests -p 'test_v2_tab_order.py' -v
      - run: pip install aiohttp pandas python-dotenv gspread==6.0.1
      - run: python -m unittest discover -s tests -p 'test_fmp_limits.py' -v
      - run: python -m unittest discover -s tests -p 'test_performance_workflows.py' -v
      - run: python -m unittest discover -s tests -p 'test_main_v2_transport.py' -v

  run-screener:
    # PRs must never run production screeners or write to Google Sheets.
    if: github.event_name != 'pull_request'
    needs: test-completion
    env:
      FMP_REQUESTS_PER_MINUTE: '1800'
      FMP_CONCURRENCY: '30'
    concurrency:
      group: production-screener
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directory for service account
        run: mkdir -p ./screener  
      
      - name: Create service_account.json
        run: |
          JSON='${{ toJson(fromJson(secrets.SERVICE_ACCOUNT_JSON)) }}'
          echo $JSON > ./screener/service_account.json
      
      - name: Set environment variables
        run: |
          echo "FMP_KEY=${{ secrets.FMP_KEY }}" >> $GITHUB_ENV

      # Same group as both independent screens; never multiply the 1800/min budget.
      - name: Preserve account-wide handoff spacing
        run: sleep 61

      - name: Run Cloud Screener
        run: |
          python cloud_screener.py


      - name: Preserve verified research handoff
        uses: actions/upload-artifact@v4
        with:
          name: research-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: research_completion.json
          if-no-files-found: error
          retention-days: 90

